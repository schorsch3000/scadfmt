name: Release

# Pushing a version tag such as v1.2.3 tests the code, builds binaries for
# Linux, macOS and Windows, and publishes them as a GitHub release.
# Tags with a suffix (v1.2.3-rc1) are published as pre-releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  OPENSCAD_REF: a81e863051c42ee04168683e945aca58d32d04a2

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' is not a version like v1.2.3 or v1.2.3-rc1"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag '$GITHUB_REF_NAME' is not on main"
            exit 1
          fi

      - name: Check out OpenSCAD (test corpus)
        uses: actions/checkout@v4
        with:
          repository: openscad/openscad
          ref: ${{ env.OPENSCAD_REF }}
          path: openscad
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build release archives
        run: make dist VERSION="$GITHUB_REF_NAME"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"
